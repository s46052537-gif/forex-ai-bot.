name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Self-checks
        run: python tests/test_all.py
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name ForexAIBot --collect-all MetaTrader5 gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: ForexAIBot-windows
          path: dist/ForexAIBot.exe
